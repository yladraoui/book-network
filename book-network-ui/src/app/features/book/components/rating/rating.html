<div class="rating-container flex items-center gap-1 text-amber-500">
  <!-- Full stars -->
  <i *ngFor="let star of fullStars" class="fas fa-star"></i>

  <!-- Half-star -->
  <i *ngIf="hasHalfStar" class="fas fa-star-half-alt"></i>

  <!-- Empty star -->
  <i *ngFor="let star of emptyStars" class="far fa-star"></i>

  <!-- Digital note -->
  <span class="text-sm font-semibold text-gray-600 ml-1">
    {{ rating | number:'1.1-1' }}
  </span>
</div>
