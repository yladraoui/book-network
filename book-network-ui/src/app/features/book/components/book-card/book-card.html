<div class="card shadow-sm border-0 rounded-3 overflow-hidden cursor-pointer" (click)="onDetails()">

  <div class="position-relative bg-light text-center" style="height: 200px;">
    <img [src]="coverImage" [alt]="book.title" class="w-100 h-100 object-fit-cover" />
    
    <!-- Overlapping badges -->
    <div class="position-absolute top-0 end-0 p-2 d-flex gap-1">
      <span *ngIf="book.shareable" class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">
        Shareable
      </span>
      <span *ngIf="book.archived" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle rounded-pill">
        Archived
      </span>
    </div>
  </div>

  <div class="card-body d-flex flex-column">
    <h5 class="card-title text-truncate fw-bold mb-1" [title]="book.title">
      {{ book.title }}
    </h5>
    <p class="card-text text-muted small mb-1">
      Par {{ book.authorName }}
    </p>
    <p class="card-text text-muted small mb-1">
      ISBN: {{ book.isbn }}
    </p>
    <p class="card-text text-muted small mb-2">
      Propriétaire: {{ book.owner }}
    </p>

    <div class="mb-2">
      <app-rating [rating]="book.rate || 0"></app-rating>
    </div>

    <p class="card-text text-secondary small mb-3 synopsis-text">
      {{ book.synopsis | slice:0:30 }}...
    </p>

    <div class="pt-2 border-top d-flex align-items-center justify-content-between gap-2 mt-auto">
      
      <ng-container *ngIf="!isManageMode">
        <!-- $event.stopPropagation() to not open the book details  -->
        <button (click)="$event.stopPropagation(); onBorrow()" [disabled]="book.archived || !book.shareable"
          class="btn btn-primary w-100 btn-sm font-weight-medium">
          Borrow book
        </button>
      </ng-container>

      <ng-container *ngIf="isManageMode">
        <button (click)="$event.stopPropagation(); onEdit()" class="btn btn-sm btn-outline-primary border-0" title="Modifier">
          <i class="fas fa-edit"></i>
        </button>
        <button (click)="$event.stopPropagation(); onShareable()" class="btn btn-sm btn-outline-success border-0" title="Changer statut partagé">
          <i class="fas fa-share-alt"></i>
        </button>
        <button (click)="$event.stopPropagation(); onArchive()" class="btn btn-sm btn-outline-warning border-0" title="Archiver">
          <i class="fas fa-archive"></i>
        </button>
      </ng-container>

    </div>
  </div>
</div>
