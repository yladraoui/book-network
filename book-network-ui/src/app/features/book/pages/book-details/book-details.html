<div class="container-fluid py-3 layout-container">
  <div class="row g-4 row-fixed">

    <!-- COLONNE GAUCHE : Détails du livre -->
    <div class="col-12 col-lg-7 col-xl-8 col-fixed">
      <div class="card shadow-sm card-scrollable">
        <div class="card-body p-4">

          <!-- Message de confirmation ou d'erreur -->
          <div *ngIf="message" [class]="'alert alert-' + level + ' alert-dismissible fade show mb-4'" role="alert">
            <span>{{ message }}</span>
            <button type="button" class="btn-close" (click)="message = ''" aria-label="Close"></button>
          </div>
          
          <div class="row g-4">
            <!-- Couverture du livre -->
            <div class="col-12 col-md-5 col-lg-4 text-center">
              <img
                [src]="book.cover ? 'data:image/jpeg;base64,' + book.cover : 'assets/images/default-book-cover.jpg'"
                [alt]="book.title || 'Book Cover'"
                class="img-fluid rounded shadow-sm w-100 object-fit-cover"
                style="max-height: 350px;" />
            </div>

            <!-- Informations principales -->
            <div class="col-12 col-md-7 col-lg-8 d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                  <h1 class="h3 font-weight-bold text-dark mb-0">{{ book.title || 'Untitled Book' }}</h1>
                  <div class="d-flex gap-1 flex-wrap">
                    <span *ngIf="book.shareable" class="badge bg-success">Shareable</span>
                    <span *ngIf="!book.shareable" class="badge bg-secondary">Not shareable</span>
                    <span *ngIf="book.archived" class="badge bg-warning text-dark">Archived</span>
                  </div>
                </div>

                <p class="text-muted mb-3">By <strong class="text-dark">{{ book.authorName || 'Unknown author' }}</strong></p>

                <!-- Étoiles -->
                <div class="d-flex align-items-center mb-4">
                  <div class="text-warning me-2 fs-6">
                    <i *ngFor="let star of fullStars" class="fas fa-star"></i>
                    <i *ngFor="let star of emptyStars" class="far fa-star"></i>
                  </div>
                  <span class="fw-bold text-dark me-1">{{ book.rate || 0 }}</span>
                  <span class="text-muted small">/ 5</span>
                </div>

                <!-- ISBN & Owner -->
                <div class="border-top border-bottom py-3 mb-4">
                  <div class="row text-muted small">
                    <div class="col-6">
                      <span class="d-block fw-semibold text-dark">ISBN</span>
                      <span>{{ book.isbn || 'N/A' }}</span>
                    </div>
                    <div class="col-6">
                      <span class="d-block fw-semibold text-dark">Owner</span>
                      <span>{{ book.owner || 'N/A' }}</span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Borrow button -->
              <div>
                <button
                  (click)="onBorrowBook()"
                  [disabled]="book.archived || !book.shareable"
                  class="btn btn-primary w-100 py-2 fw-medium">
                  <i class="fas fa-bookmark me-2"></i> Borrow this book
                </button>
              </div>

            </div>
          </div>

          <!-- Synopsis -->
          <div class="mt-4 pt-3 border-top">
            <h2 class="h5 fw-bold text-dark mb-2">Synopsis</h2>
            <p class="text-secondary lh-base fs-6">
              {{ book.synopsis || 'No synopsis available for this book.' }}
            </p>
          </div>

        </div>
      </div>
    </div>

    <!-- COLONNE DROITE : Feedbacks -->
    <div class="col-12 col-lg-5 col-xl-4 col-fixed">
      <div class="card shadow-sm card-scrollable">
        <div class="card-body p-3">
          <app-feedback-list [bookId]="bookId"></app-feedback-list>
        </div>
      </div>
    </div>

  </div>
</div>
