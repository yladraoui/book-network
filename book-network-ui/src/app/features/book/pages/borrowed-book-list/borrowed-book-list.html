<div class="container py-4">
  <h1 class="h3 font-weight-bold text-dark mb-4">My Borrowed Books</h1>

  <!-- Alert Message -->
  <div *ngIf="message" [class]="'alert alert-' + level+ ' alert-dismissible fade show mb-4'" role="alert">
    <span>{{ message }}</span>
    <button type="button" class="btn-close" (click)="message = ''" aria-label="Close"></button>
  </div>

  <!-- Borrowed Books Table -->
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body p-0">
      <div class="table-responsive" *ngIf="borrowedBooksResponse.content && borrowedBooksResponse.content.length > 0; else emptyBlock">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col" class="ps-4">Title</th>
              <th scope="col">Author</th>
              <th scope="col">Rating</th>
              <th scope="col">Status</th>
              <th scope="col" class="text-end pe-4">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let book of borrowedBooksResponse.content">
              <td class="ps-4 fw-semibold text-dark">{{ book.title }}</td>
              <td class="text-secondary">{{ book.authorName }}</td>
              <td>
                <app-rating [rating]="book.rate || 0"></app-rating>
              </td>
              <td>
                <!-- Status Badges -->
                <span *ngIf="book.returnApproved" class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">
                  <i class="fas fa-check-circle me-1"></i> Return Approved
                </span>
                <span *ngIf="book.returned && !book.returnApproved" class="badge bg-warning-subtle text-warning border border-warning-subtle rounded-pill">
                  <i class="fas fa-clock me-1"></i> Returned (Pending)
                </span>
                <span *ngIf="!book.returned" class="badge bg-info-subtle text-info border border-info-subtle rounded-pill">
                  <i class="fas fa-book-reader me-1"></i> Borrowed
                </span>
              </td>
              <td class="text-end pe-4">
                <button
                  *ngIf="!book.returned"
                  (click)="returnBook(book)"
                  class="btn btn-sm btn-outline-primary">
                  <i class="fas fa-paper-plane me-1"></i> Return Book
                </button>
                <span *ngIf="book.returned" class="text-muted small italic">
                  No action required
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Empty State -->
      <ng-template #emptyBlock>
        <div class="text-center py-5 text-muted">
          <i class="fas fa-book-open fs-1 mb-3 d-block text-secondary"></i>
          <p class="mb-0">You have not borrowed any books yet.</p>
        </div>
      </ng-template>
    </div>
  </div>

  <!-- Pagination -->
  <div class="d-flex justify-content-center" *ngIf="(borrowedBooksResponse.totalPages || 0) > 1">
    <app-pagination
      [page]="page"
      [totalPages]="borrowedBooksResponse.totalPages || 0"
      [isFirst]="borrowedBooksResponse.first ?? true"
      [isLast]="borrowedBooksResponse.last ?? true"
      (pageChange)="onPageChange($event)">
    </app-pagination>
  </div>
</div>
