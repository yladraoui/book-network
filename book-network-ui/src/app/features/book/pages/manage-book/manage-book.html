<div class="container my-3 my-lg-2" style="max-width: 1000px;">
  <div class="card shadow-sm border-0">
    <div class="card-body p-3 p-md-4">
      

      <h2 class="card-title h5 mb-3 text-dark font-weight-bold">
        {{ bookRequest.id ? 'Edit book' : 'New book' }}
      </h2>

      <div *ngIf="errorMsg.length > 0" class="alert alert-danger mb-3 py-2" role="alert">
        <ul class="mb-0 list-unstyled small">
          <li *ngFor="let msg of errorMsg">
            <i class="fas fa-exclamation-circle me-2"></i>{{ msg }}
          </li>
        </ul>
      </div>

      <form (ngSubmit)="saveBook()">
        
        
        <div class="row g-3">
          
      
          <div class="col-12 col-lg-6 d-flex flex-column justify-content-between">
            
           
            <div class="d-flex align-items-center gap-3 mb-2">
              <img
                [src]="selectedPicture || 'assets/images/default-cover.png'"
                alt="Couverture"
                class="img-thumbnail object-fit-cover rounded"
                style="width: 90px; height: 120px;" />
              <div class="flex-grow-1">
                <label for="coverInput" class="form-label font-weight-bold text-secondary small mb-1">Couverture du livre</label>
                <input
                  id="coverInput"
                  type="file"
                  (change)="onFileSelected($event)"
                  accept="image/*"
                  class="form-control form-control-sm" />
              </div>
            </div>

            
            <div class="mb-2">
              <label for="title" class="form-label font-weight-bold small mb-1">Title</label>
              <input
                id="title"
                type="text"
                [(ngModel)]="bookRequest.title"
                name="title"
                required
                class="form-control form-control-sm"
                placeholder="Ex: Le Petit Prince" />
            </div>

            
            <div class="mb-2">
              <label for="authorName" class="form-label font-weight-bold small mb-1">Author</label>
              <input
                id="authorName"
                type="text"
                [(ngModel)]="bookRequest.authorName"
                name="authorName"
                required
                class="form-control form-control-sm"
                placeholder="Ex: Antoine de Saint-Exupéry" />
            </div>

           
            <div class="mb-0">
              <label for="isbn" class="form-label font-weight-bold small mb-1">ISBN</label>
              <input
                id="isbn"
                type="text"
                [(ngModel)]="bookRequest.isbn"
                name="isbn"
                required
                class="form-control form-control-sm"
                placeholder="Ex: 978-3-16-148410-0" />
            </div>

          </div>

          
          <div class="col-12 col-lg-6 d-flex flex-column justify-content-between">
            
            
            <div class="mb-2 flex-grow-1 d-flex flex-column">
              <label for="synopsis" class="form-label font-weight-bold small mb-1">Synopsis</label>
              <textarea
                id="synopsis"
                [(ngModel)]="bookRequest.synopsis"
                name="synopsis"
                rows="7"
                required
                class="form-control form-control-sm flex-grow-1"
                placeholder="Résumé du livre..."></textarea>
            </div>

            
            <div class="form-check mb-2">
              <input
                id="shareable"
                type="checkbox"
                [(ngModel)]="bookRequest.shareable"
                name="shareable"
                class="form-check-input" />
              <label for="shareable" class="form-check-label small">
                Make this book available to borrow
              </label>
            </div>

          </div>

        </div>

        
        <div class="d-flex justify-content-end gap-2 pt-2 mt-3 border-top">
          <a routerLink="/books/my-books" class="btn btn-outline-secondary btn-sm">
            Cancel
          </a>
          <button type="submit" class="btn btn-primary btn-sm">
            <i class="fas fa-save me-1"></i> Save
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
