<div class="container py-4">
  <h2 class="fw-bold mb-4"><i class="fas fa-user-circle me-2"></i>{{fullname}}</h2>

  <div class="row g-4">
    <!-- Informations Personnelles -->
    <div class="col-lg-6">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-header bg-primary text-white font-weight-bold">
          <i class="fas fa-user-edit me-2"></i> Personal Information
        </div>
        <div class="card-body">
          <div *ngIf="profileMessage" [class]="'alert alert-' + profileMessageType + ' alert-dismissible fade show'">
            {{ profileMessage }}
            <button type="button" class="btn-close" (click)="profileMessage = ''"></button>
          </div>

          <form (ngSubmit)="onUpdateProfile()">
            <div class="mb-3">
              <label class="form-label font-weight-bold">Email Address (Read-only)</label>
              <input type="email" class="form-control bg-light" [value]="profile.email" readonly disabled />
            </div>

            <div class="mb-3">
              <label class="form-label font-weight-bold">First Name</label>
              <input type="text" class="form-control" name="firstname" [(ngModel)]="updateRequest.firstname" required />
            </div>

            <div class="mb-3">
              <label class="form-label font-weight-bold">Last Name</label>
              <input type="text" class="form-control" name="lastname" [(ngModel)]="updateRequest.lastname" required />
            </div>

            <div class="mb-3">
              <label class="form-label font-weight-bold">Date of Birth</label>
              <input type="date" class="form-control" name="dateOfBirth" [(ngModel)]="updateRequest.dateOfBirth" />
            </div>

            <button type="submit" class="btn btn-primary w-100">
              <i class="fas fa-save me-1"></i> Save Profile Changes
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Modification du Mot de Passe -->
    <div class="col-lg-6">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-header bg-dark text-white font-weight-bold">
          <i class="fas fa-key me-2"></i> Change Password
        </div>
        <div class="card-body">
          <div *ngIf="passwordMessage" [class]="'alert alert-' + passwordMessageType + ' alert-dismissible fade show'">
            {{ passwordMessage }}
            <button type="button" class="btn-close" (click)="passwordMessage = ''"></button>
          </div>

          <form (ngSubmit)="onChangePassword()">
            <div class="mb-3">
              <label class="form-label font-weight-bold">Current Password</label>
              <input type="password" class="form-control" name="currentPassword" [(ngModel)]="passwordRequest.currentPassword" required />
            </div>

            <div class="mb-3">
              <label class="form-label font-weight-bold">New Password</label>
              <input type="password" class="form-control" name="newPassword" [(ngModel)]="passwordRequest.newPassword" required minlength="8" />
            </div>

            <div class="mb-3">
              <label class="form-label font-weight-bold">Confirm New Password</label>
              <input type="password" class="form-control" name="confirmationPassword" [(ngModel)]="passwordRequest.confirmationPassword" required />
            </div>

            <button type="submit" class="btn btn-dark w-100">
              <i class="fas fa-lock me-1"></i> Update Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
