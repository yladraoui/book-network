<div class="container py-4">
  <h2 class="fw-bold mb-4"><i class="fas fa-user-shield me-2 text-warning"></i>Admin Control Panel</h2>

  <!-- 1. Stats Dashboard Cards -->
  <div class="row g-4 mb-5">
    <div class="col-md-4">
      <div class="card bg-primary text-white shadow-sm border-0">
        <div class="card-body d-flex align-items-center justify-content-between p-4">
          <div>
            <h6 class="text-uppercase mb-1 opacity-75">Total Users</h6>
            <h2 class="fw-bold mb-0">{{ stats.totalUsers }}</h2>
          </div>
          <i class="fas fa-users fs-1 opacity-50"></i>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card bg-success text-white shadow-sm border-0">
        <div class="card-body d-flex align-items-center justify-content-between p-4">
          <div>
            <h6 class="text-uppercase mb-1 opacity-75">Total Books</h6>
            <h2 class="fw-bold mb-0">{{ stats.totalBooks }}</h2>
          </div>
          <i class="fas fa-book fs-1 opacity-50"></i>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card bg-dark text-white shadow-sm border-0">
        <div class="card-body d-flex align-items-center justify-content-between p-4">
          <div>
            <h6 class="text-uppercase mb-1 opacity-75">Borrowed Transactions</h6>
            <h2 class="fw-bold mb-0">{{ stats.totalBorrowedBooks }}</h2>
          </div>
          <i class="fas fa-hand-holding-heart fs-1 opacity-50"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. Users Management Table -->
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white py-3">
      <h5 class="fw-bold mb-0"><i class="fas fa-users-cog me-2"></i>User Management</h5>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-4">Name</th>
              <th>Email</th>
              <th>Status</th>
              <th class="text-end pe-4">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users">
              <td class="ps-4 fw-semibold">{{ user.firstname }} {{ user.lastname }}</td>
              <td>{{ user.email }}</td>
              <td>
                <span [class]="user.accountLocked ? 'badge bg-danger' : 'badge bg-success'">
                  {{ user.accountLocked ? 'Locked' : 'Active' }}
                </span>
              </td>
              <td class="text-end pe-4">
                <button (click)="toggleLock(user)" [class]="user.accountLocked ? 'btn btn-sm btn-outline-success' : 'btn btn-sm btn-outline-danger'">
                  <i [class]="user.accountLocked ? 'fas fa-unlock me-1' : 'fas fa-lock me-1'"></i>
                  {{ user.accountLocked ? 'Unlock' : 'Lock' }}
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
