<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-4">Log in</h3>
    
    <div *ngIf="errorMessage.length > 0" class="alert alert-danger" role="alert">
      <p *ngFor="let msg of errorMessage" class="mb-0">Error: {{ msg }}</p>
    </div>

    <form (ngSubmit)="login()">
      <div class="mb-3">
        <label for="email" class="form-label">Email Adress</label>
        <input 
          type="email" 
          class="form-control" 
          id="email" 
          [(ngModel)]="authRequest.email" 
          name="email" 
          placeholder="nom@exemple.com" 
          required
        >
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          class="form-control" 
          id="password" 
          [(ngModel)]="authRequest.password" 
          name="password" 
          required
        >
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="button" (click)="register()" class="btn btn-link text-decoration-none text-center">
          Create account?
        </button>
      </div>
    </form>
  </div>
</div>
