<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light p-3 p-md-5">
  <div class="card shadow-lg border-0 rounded-4 overflow-hidden register-card">
    <div class="row g-0">
      
      <!-- Left Section: Promotional Banner with Blurred Background -->
      <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-between p-5 text-white left-banner">
        <div class="d-flex align-items-center gap-2">
          <i class="fas fa-book-reader fs-3 text-warning"></i>
          <span class="fs-4 fw-bold tracking-wide">Book Network</span>
        </div>

        <div class="my-auto py-4">
          <h1 class="display-5 fw-bold mb-3 text-shadow">Join the Community of Readers</h1>
          <p class="lead opacity-90 mb-4 text-shadow">
            Create an account to manage your collection, lend your books, and connect with other readers.
          </p>
          <div class="d-flex gap-3 align-items-center">
            <div class="badge bg-dark bg-opacity-50 border border-light-subtle text-white p-2.5 rounded-3 shadow-sm backdrop-blur">
              <i class="fas fa-books text-warning me-1"></i> +10,000 Books
            </div>
            <div class="badge bg-dark bg-opacity-50 border border-light-subtle text-white p-2.5 rounded-3 shadow-sm backdrop-blur">
              <i class="fas fa-users text-info me-1"></i> Active Network
            </div>
          </div>
        </div>

        <div class="small opacity-75">
          &copy; 2026 Book Network. All rights reserved.
        </div>
      </div>

      <!-- Right Section: Register Form -->
      <div class="col-lg-6 p-4 p-sm-5 bg-white d-flex flex-column justify-content-center">
        <div class="mb-4 text-center text-lg-start">
          <h2 class="fw-bold text-dark">Create an Account</h2>
          <p class="text-muted">Enter your personal details to get started.</p>
        </div>

        <!-- Error Alert -->
        <div *ngIf="errorMsg.length > 0" class="alert alert-danger rounded-3 shadow-sm mb-4" role="alert">
          <div *ngFor="let msg of errorMsg" class="d-flex align-items-center gap-2 small">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ msg }}</span>
          </div>
        </div>

        <!-- Form -->
        <form (ngSubmit)="onRegister()">
          
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label for="firstname" class="form-label fw-semibold">First Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                <input 
                  type="text" 
                  class="form-control border-start-0 bg-light" 
                  id="firstname" 
                  [(ngModel)]="registerRequest.firstname" 
                  name="firstname" 
                  placeholder="John" 
                  [disabled]="isLoading"
                  required
                >
              </div>
            </div>

            <div class="col-md-6">
              <label for="lastname" class="form-label fw-semibold">Last Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                <input 
                  type="text" 
                  class="form-control border-start-0 bg-light" 
                  id="lastname" 
                  [(ngModel)]="registerRequest.lastname" 
                  name="lastname" 
                  placeholder="Doe" 
                  [disabled]="isLoading"
                  required
                >
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
              <input 
                type="email" 
                class="form-control border-start-0 bg-light" 
                id="email" 
                [(ngModel)]="registerRequest.email" 
                name="email" 
                placeholder="name@example.com" 
                [disabled]="isLoading"
                required
              >
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
              <input 
                [type]="showPassword ? 'text' : 'password'" 
                class="form-control border-start-0 border-end-0 bg-light" 
                id="password" 
                [(ngModel)]="registerRequest.password" 
                name="password" 
                placeholder="••••••••"
                [disabled]="isLoading"
                required
              >
              <button 
                type="button" 
                class="btn btn-light border border-start-0 text-muted" 
                (click)="togglePasswordVisibility()"
                [disabled]="isLoading"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              >
                <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>

          <div class="d-grid gap-2">
            <button 
              type="submit" 
              class="btn btn-primary btn-lg rounded-3 fw-semibold shadow-sm d-flex align-items-center justify-content-center gap-2"
              [disabled]="isLoading"
            >
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              <i *ngIf="!isLoading" class="fas fa-user-plus"></i>
              <span>{{ isLoading ? 'Creating Account...' : 'Sign Up' }}</span>
            </button>
            
            <button 
              type="button" 
              (click)="login()" 
              class="btn btn-outline-secondary btn-lg rounded-3 fw-semibold mt-2"
              [disabled]="isLoading"
            >
              Already have an account? Log In
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
